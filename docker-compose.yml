version: "3.8"

services:
  huay-backend:
    image: huay_backend:1.0.0
    container_name: huay-backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./uploads:/app/uploads
    networks:
      - default
      - mongo-db_default
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile

networks:
  mongo-db_default:
    external: true